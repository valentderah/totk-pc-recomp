name: Crash
description: The game closes, freezes or shows a FATAL message.
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: |
        Check the pinned issues at the top of the issue list first: they cover the known crashes and their workarounds.

        Do not attach or link game files, keys, firmware or builds. Issues that do are closed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the pinned issues and [searched open and closed issues](https://github.com/valentderah/totk-pc-recomp/issues?q=is%3Aissue) for this crash.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The title line of the settings menu (F1), for example "TotK Recomp 0.1.0, game 1.4.3".
    validations:
      required: true
  - type: input
    id: last-good
    attributes:
      label: Last version that worked
      description: If an earlier version did not crash at this point, which one.
  - type: textarea
    id: system
    attributes:
      label: System info
      description: Paste what Copy system info (F1, Advanced tab) puts on the clipboard. On a Steam Deck, add LCD or OLED.
      render: text
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods and cheats
      description: The folders in mods/ with their download links, or "none". Say whether it also crashes without them.
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - At startup, before the Nintendo logo
        - Between the Nintendo logo and the title screen
        - While loading a save
        - In gameplay
        - In a cutscene
    validations:
      required: true
  - type: dropdown
    id: blocker
    attributes:
      label: Can you keep playing?
      options:
        - "Yes, it does not happen again after a restart, or I can avoid it"
        - "No, it happens every time at the same point"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did before the crash
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### The log

        - The log of the run that crashed is `logs\totk.log` in the folder of `totk.exe` (F1, Advanced tab, Open log folder). Copy it before you start the game again: the next start renames it to `totk.1.log`, and after five starts it is gone.
        - Attach the whole file. Do not cut or edit it: the crash report is at the end, the GPU and driver lines are at the start.
        - The log says `device lost` or `VK_ERROR_DEVICE_LOST` and the GPU is an NVIDIA one: set GPU pass marks to On (F1, Advanced tab, Diagnostics), restart the game, make it crash again and attach that log. The `vk: pass marks` lines then name what the GPU was drawing.
        - The crash happens at the same point every time: also attach the input recording and the save described in the Other bug template.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag totk.log into this field.
    validations:
      required: true
