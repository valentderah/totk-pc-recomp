name: Graphics glitch
description: Artifacts, missing or broken textures, flicker, wrong colours or shadows.
labels: [bug, graphics]
body:
  - type: markdown
    attributes:
      value: |
        Check the pinned issues at the top of the issue list first: they cover the known glitches on each GPU.

        Do not attach or link game files, keys, firmware or builds. Issues that do are closed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the pinned issues and [searched open and closed issues](https://github.com/valentderah/totk-pc-recomp/issues?q=is%3Aissue) for this glitch.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The title line of the settings menu (F1), for example "TotK Recomp 0.1.0, game 1.4.3".
    validations:
      required: true
  - type: input
    id: last-good
    attributes:
      label: Last version that worked
      description: If an earlier version drew this correctly, which one.
  - type: textarea
    id: system
    attributes:
      label: System info
      description: Paste what Copy system info (F1, Advanced tab) puts on the clipboard. It lists the settings you changed too. On a Steam Deck, add LCD or OLED.
      render: text
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods and cheats
      description: The folders in mods/ with their download links, or "none". Say whether the glitch also shows without them. Turn off ReShade and other overlays that draw into the game before you report.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Drag the file into this field. Say where in the game it was taken. Flicker needs a video.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What looks wrong and when
      description: Does it show all the time, in one place, or after some time in play? Does it go away after a restart, or when you change a setting?
    validations:
      required: true
  - type: dropdown
    id: blocker
    attributes:
      label: Can you keep playing?
      options:
        - "Yes"
        - "No, I cannot see enough to play"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag logs\totk.log from the folder of totk.exe into this field, from the run that showed the glitch. Copy it before you start the game again.
    validations:
      required: true
