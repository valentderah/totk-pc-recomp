name: Launcher

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish launcher/TotKLauncher/TotKLauncher.csproj -c Release -o launcher/dist/TotKLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: TotKLauncher-win-x64
          path: launcher/dist/TotKLauncher
