[package]
name = "totk-configurator"
version = "0.1.0"
edition = "2021"
description = "Settings configurator for the TotK PC recomp: edits totk.ini and settings profiles before the game starts"
license = "MIT"
publish = false

[[bin]]
name = "totk-config"
path = "src/main.rs"

[dependencies]
# MIT OR Apache-2.0. glow (OpenGL) only: no wgpu, no accesskit; fonts come from runtime/ui/fonts and the system.
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
rfd = "0.15.4"            # MIT: the folder picker
serde = { version = "1", features = ["derive"] }   # MIT OR Apache-2.0
serde_json = "1"          # MIT OR Apache-2.0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
